# Global project settings.  Environment variables (see .env.example) override
# the corresponding values at runtime.

project_name: agentic-feature-exploration
random_seed: 20240517
offline_mode: auto          # auto | always | never  (auto = detect network per call)

paths:
  data_root: data
  raw: data/raw
  interim: data/interim
  processed: data/processed
  features: data/features
  metadata: data/metadata
  artifacts: artifacts
  figures: artifacts/figures
  tables: artifacts/tables
  logs: artifacts/execution_logs
  reports: reports

logging:
  level: INFO
  format: "%(asctime)s %(levelname)-8s %(name)s :: %(message)s"
  file: artifacts/execution_logs/pipeline.log
  json_events: artifacts/execution_logs/events.jsonl

llm:
  provider: offline          # anthropic | deepseek | offline  (env LLM_PROVIDER overrides)
  model: null                # set LLM_MODEL or config/here; verified against provider model list
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 60
  max_retries: 3
  request_cache: artifacts/execution_logs/llm_cache.jsonl
  # Never fall back silently to a different model: an unknown model id is a hard error
  # when a networked provider is selected.
  allow_offline_fallback: true

execution:
  mode: standard             # smoke | standard | full
  use_cache: true
  max_subjects: 6
  parallel_workers: 1

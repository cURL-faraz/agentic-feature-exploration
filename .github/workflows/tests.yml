name: tests

# Runs fully offline: the suite generates a small deterministic synthetic corpus
# and uses the offline LLM provider, so no dataset download, no network calls and
# no API key are required.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLCONFIGDIR: ${{ runner.temp }}/mplcache
  LOKY_MAX_CPU_COUNT: "2"
  EEG_AGENT_FORCE_OFFLINE_LLM: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the verified interpreter.  3.14 is the target and is allowed to
        # fail until CPython-3.14 wheels exist for the scientific stack.
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: python -m ruff check src tests

      - name: Run the offline test suite
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: python -m pytest tests/ -q

      - name: Smoke-run the full pipeline end to end
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: python -m eeg_research_agent.cli run --mode smoke

      - name: Upload reports and tables on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            reports/
            artifacts/tables/
          if-no-files-found: ignore
          retention-days: 7

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-research-agent"
version = "0.1.0"
description = "Agentic literature review, EEG feature discovery, statistical analysis and verification for single-channel sleep staging"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
authors = [{ name = "agentic-feature-exploration contributors" }]
keywords = ["eeg", "sleep-staging", "feature-engineering", "langgraph", "statistics"]

dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "mne>=1.6",
  "pooch>=1.8",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]
llm = ["langchain-anthropic>=0.2", "langchain-openai>=0.2"]
parquet = ["pyarrow>=17.0"]
stats = ["statsmodels>=0.14"]

[project.scripts]
eeg-research-agent = "eeg_research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: long-running tests",
  "network: tests that require internet access",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".conda", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src"]

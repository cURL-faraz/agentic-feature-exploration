# Dataset acquisition configuration.
#
# The preferred dataset is Sleep-EDF Expanded (PhysioNet).  When the machine has
# no network access (CI sandboxes, air-gapped review environments) the pipeline
# automatically switches to the deterministic synthetic PSG generator and labels
# every downstream artifact as `data_origin: synthetic`.  No scientific claim in
# the generated reports may be attributed to Sleep-EDF unless the real files
# were actually read.

dataset_name: sleep-edf-expanded
data_origin: auto            # auto | sleep-edf | synthetic

source:
  provider: physionet
  doi: 10.13026/C2X676
  landing_page: https://physionet.org/content/sleep-edfx/1.0.0/
  file_base_url: https://physionet.org/files/sleep-edfx/1.0.0
  # `sleep-cassette` = SC recordings (2 EEG channels incl. Fpz-Cz), `sleep-telemetry` = ST
  collection: sleep-cassette
  file_pattern: "SC{subj:02d}{night}S0{recording}E0-PSG.edf"
  annotation_pattern: "SC{subj:02d}{night}S0{recording}E0-Hypnogram.edf"
  mne_dataset: sleep_physionet.age
  citation: >
    Kemp B, Zwinderman AH, Tuk B, Kamphuisen HAC, Oberye JJL (2000).
    Analysis of a sleep-dependent neuronal feedback loop: the slow-wave
    microcontinuity of the EEG. IEEE-BME 47(9):1185-1194.

subset:
  # 0-based SC subject ids; recordings 1 and 2 are two nights for the same subject.
  subjects: [0, 1, 2, 3, 4, 5]
  recordings: [1, 2]
  max_recording_seconds: 1800     # short window keeps the demo pipeline fast

fallback:
  mode: synthetic_psg
  subjects: 8
  epochs_per_subject: 120
  seed: 20240517
  effect_strength: 1.0

signal:
  # Inspector picks the first available entry (case/space insensitive).
  channel_preference:
    - "EEG Fpz-Cz"
    - "EEG Pz-Oz"
    - "Fpz-Cz"
    - "Pz-Oz"
    - "EEG"
    - "C3"
  epoch_seconds: 30
  target_sampling_frequency: 100
  min_epochs_per_subject: 20
  # an epoch is kept when one annotation covers at least this fraction of it
  min_annotation_coverage: 0.5

stages:
  supported: [W, N1, N2, N3, REM]
  # Sleep-EDF annotation strings -> canonical stage labels.
  annotation_map:
    "Sleep stage W": W
    "Sleep stage 1": N1
    "Sleep stage 2": N2
    "Sleep stage 3": N3
    "Sleep stage 4": N3
    "Sleep stage R": REM
    "Sleep stage ?": UNKNOWN
    "Movement time": UNKNOWN
  unsupported_labels: [UNKNOWN]

preprocessing:
  bandpass: [0.3, 45.0]
  notch_hz: 50.0
  notch_quality: 30.0
  apply_notch: true
  clip_sigma: 8.0                 # reject epochs with peak-to-peak > clip_sigma * robust_scale
  min_amplitude_uv: 0.5
  max_amplitude_uv: 1000.0
  detrend: true
  reference: none                 # single-channel: no re-referencing

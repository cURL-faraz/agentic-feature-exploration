# featurelab configuration.
#
# This file IS the pre-registration: every threshold that decides whether a
# feature is "accepted" is written here *before* any hypothesis is tested.
# Changing a threshold after seeing results is p-hacking - bump `protocol_version`
# and start a fresh ledger instead.
protocol_version: 1

data:
  # Root for raw EDF files and epoch caches. The env var FEATURELAB_DATA overrides it.
  root: data/featurelab
  channel: "EEG Fpz-Cz"
  sfreq: 100              # Sleep-EDF EEG is sampled at 100 Hz
  epoch_s: 30
  wake_margin_min: 30     # keep 30 min of wake before/after sleep (standard in the literature)
  cohorts:
    discovery: sc20       # Sleep-EDF-20  (SC subjects 0-19)  - the agents search here
    lockbox: sc_lockbox   # SC subjects 20-39                  - opened once per finalist
    external: st          # Sleep Telemetry (other study)      - generalisation check

evaluation:
  target_stages: [N1, N2, REM]       # the stages single-channel EEG confuses
  confusion_pairs: [[N1, REM], [N1, N2], [N2, REM], [N1, W]]
  context_epochs: 1                  # model also sees features of the previous/next epoch
  cv_folds: 5                        # subject-grouped folds on the discovery cohort
  model:
    kind: hgb                        # hgb (HistGradientBoosting) | logreg
    max_iter: 120
    learning_rate: 0.1
  seed: 20240517

  screen:                            # Stage A - cheap filters, kill bad ideas early
    max_nan_fraction: 0.05
    max_redundancy_rho: 0.95         # |Spearman| with any baseline feature
    min_auc_shift: 0.05              # |AUC - 0.5| on at least one confusion pair
    subsample: 8000

  incremental:                       # Stage B - does it ADD information?
    alpha: 0.05
    hypothesis_budget: 50            # Bonferroni: each test uses alpha / budget
    min_delta: 0.005                 # minimum mean gain in target macro-F1 (0.5 points)
    null_shuffles: 2                 # shuffled-copy control: gain must beat noise

  confirm:                           # Stage C - lockbox (same population, unseen)
    alpha: 0.05                      # Holm-corrected across finalists of a run
    min_delta: 0.0

sandbox:
  timeout_s: 900
  max_ms_per_epoch: 25
  max_code_chars: 6000
  workers: 0                         # 0 = all CPU cores

llm:
  provider: openrouter               # openrouter | scripted (offline demo / tests)
  base_url: https://openrouter.ai/api/v1
  # Free models change often. These are preferences; `featurelab models` lists what
  # is free today, and the client falls back down the list on errors / rate limits.
  roles:
    scout:    ["meta-llama/llama-3.3-70b-instruct:free", "google/gemma-3-27b-it:free", "mistralai/mistral-small-3.2-24b-instruct:free"]
    inventor: ["deepseek/deepseek-r1-0528:free", "qwen/qwen3-coder:free", "deepseek/deepseek-chat-v3-0324:free"]
    critic:   ["meta-llama/llama-3.3-70b-instruct:free", "google/gemma-3-27b-it:free", "mistralai/mistral-small-3.2-24b-instruct:free"]
  auto_free_fallback: true           # if every listed model fails, try any currently-free model
  temperature: {scout: 0.2, inventor: 0.9, critic: 0.1}
  max_tokens: 4000
  min_seconds_between_calls: 4       # free tier is ~20 requests/minute
  daily_call_cap: 45                 # free tier is ~50 requests/day without credits
  timeout_s: 180

loop:
  max_iterations: 10                 # hypotheses per run
  target_accepted: 1                 # stop after this many accepted features
  max_repairs: 2                     # inventor self-repair attempts on gate errors
  max_revisions: 1                   # critic -> inventor revision rounds

literature:
  queries:
    - "single-channel EEG automatic sleep staging"
    - "sleep stage classification single EEG channel features"
    - "N1 sleep stage detection EEG"
    - "REM sleep detection without EOG EMG single channel EEG"
    - "ear-EEG sleep staging"
  per_query: 12
  recent_from_year: 2021
  max_papers: 40

# Conda environment for the EEG research agent.
#
# IMPORTANT (see docs/environment_notes.md): the project targets Python 3.14.
# In the reference execution sandbox PyPI/conda channels were unreachable and no
# CPython-3.14 wheels existed for numpy/scipy/scikit-learn/matplotlib, so the
# verified runtime is Python 3.13.  Change `python=3.13` to `python=3.14` once
# wheels for the scientific stack are available for that interpreter.
name: eeg-research-agent
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy>=2.0
  - scipy>=1.14
  - scikit-learn>=1.5
  - pandas>=2.2
  - matplotlib>=3.9
  - seaborn>=0.13
  - pyyaml>=6.0
  - jinja2>=3.1
  - pip
  - pip:
      - mne>=1.6
      - pooch>=1.8
      - pydantic>=2.9
      - pydantic-settings>=2.5
      - python-dotenv>=1.0
      - httpx>=0.27
      - langchain-core>=0.3
      - langgraph>=0.2
      - rich>=13.0
      - pytest>=8.0
      - ruff>=0.6

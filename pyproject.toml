[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featurelab"
version = "0.2.0"
description = "Agentic discovery and statistical validation of single-channel EEG features for sleep staging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faraz Ameri" }]
keywords = ["eeg", "sleep-staging", "feature-discovery", "multi-agent", "langgraph", "openrouter"]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "mne>=1.5",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
featurelab = "featurelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
featurelab = ["default_config.yaml", "agents/prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
